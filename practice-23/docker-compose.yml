services:
  backend1:
    build:
      context: .
      dockerfile: Dockerfile
    image: practice23-backend:latest
    container_name: practice23-backend1
    environment:
      BACKEND_NAME: backend-1
      PORT: 3000
    expose:
      - "3000"

  backend2:
    build:
      context: .
      dockerfile: Dockerfile
    image: practice23-backend:latest
    container_name: practice23-backend2
    environment:
      BACKEND_NAME: backend-2
      PORT: 3000
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: practice23-nginx
    depends_on:
      - backend1
      - backend2
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro