<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PWA-приложение заметок с App Shell и офлайн-режимом.">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/icon-152x152.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
  <title>Practice 17 - Push Reminders</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>А вот и «Заметки» - наше первое <span class="no-break">оффлайн-приложение</span></h1>
    <nav class="tabs is-center">
      <button id="home-btn" class="tab active col-6" type="button">Главная</button>
      <button id="about-btn" class="tab col-6" type="button">О нас</button>
    </nav>
  </header>

  <main id="app-content" class="container" style="margin-top: 2rem;">

  </main>

  <footer class="is-center" style="margin-top: 1.5rem;">
    <button id="enable-push" class="button success" type="button">Включить уведомления</button>
    <button id="disable-push" class="button error" type="button" style="display: none;">Отключить уведомления</button>
  </footer>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
