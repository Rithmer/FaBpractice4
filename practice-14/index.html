<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PWA-приложение для заметок: создание, удаление и офлайн-доступ к списку заметок.">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2f7d32">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icons/icon-152x152.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32x32.png">
  <title>Practice 14 - PWA заметки</title>
  <style>
    body {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .status {
      margin: 10px 0 18px;
      font-size: 0.95rem;
      opacity: 0.85;
    }

    .notes-empty {
      opacity: 0.65;
      margin-top: 10px;
    }

    .note-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .note-text {
      word-break: break-word;
      padding-right: 8px;
    }

    .note-actions {
      white-space: nowrap;
    }

    #notes-list {
      list-style: none;
      padding: 0;
      margin: 14px 0 0;
    }

    #note-form {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    #note-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #cfcfcf;
      border-radius: 8px;
    }

    button {
      padding: 10px 14px;
      border: 1px solid #cfcfcf;
      background: #f5f5f5;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #ebebeb;
    }
  </style>
</head>
<body>
  <header>
    <h1>Practice 14: PWA-заметки</h1>
    <p>Добавляйте заметки. Интерфейс и данные доступны даже при отсутствии сети.</p>
  </header>

  <main>
    <div id="network-status" class="status" aria-live="polite"></div>

    <form id="note-form" autocomplete="off">
      <input
        id="note-input"
        type="text"
        placeholder="Введите заметку"
        maxlength="200"
        required
      >
      <button type="submit">Добавить</button>
    </form>

    <button id="clear-btn" class="button clear" type="button">Очистить список</button>

    <ul id="notes-list" aria-live="polite"></ul>
    <p id="empty-state" class="notes-empty">Пока заметок нет.</p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
